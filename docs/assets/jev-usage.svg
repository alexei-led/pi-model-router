    <text class="muted" x="472" y="140">26 parent sessions · 1,623 responses</text>
    <text class="muted" x="472" y="179">Micro</text><rect class="track" x="551" y="163" width="202" height="20" rx="3"/><rect class="bar" x="551" y="163" width="19.2" height="20" rx="3"/><text class="text" x="768" y="179">9.5%</text>
    <text class="muted" x="472" y="213">Low</text><rect class="track" x="551" y="197" width="202" height="20" rx="3"/><rect class="bar" x="551" y="197" width="154.2" height="20" rx="3"/><text class="text" x="768" y="213">76.3%</text>
