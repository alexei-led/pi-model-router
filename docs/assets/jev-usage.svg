    <text class="muted" x="44" y="247">Medium</text><rect class="track" x="123" y="231" width="202" height="20" rx="3"/><rect class="bar" x="123" y="231" width="33.1" height="20" rx="3"/><text class="text" x="340" y="247">16.4%</text>
    <text class="muted" x="44" y="281">High</text><rect class="track" x="123" y="265" width="202" height="20" rx="3"/><rect class="bar" x="123" y="265" width="168.9" height="20" rx="3"/><text class="text" x="340" y="281">83.6%</text>
    <text class="muted" x="44" y="315" font-size="14">37 unique Jev requests in retained metrics</text>
