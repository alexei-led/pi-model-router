<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="title">Jev in use: different profiles, different routes</title>
  <desc id="desc">Recorded responses on September 23–24, 2026. Pi: 25 sessions, 1,967 responses, medium 322 and high 1,645. Claude Code: 26 parent sessions, 1,623 responses, micro 154, low 1,239, medium 73 and high 157. The workloads and policies differ. Route share is not a savings or quality benchmark.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; }
    .text { fill: #0f172a; }
    .muted { fill: #475569; }
    .track { fill: #e2e8f0; }
    .bar { fill: #2563eb; }
    .rule { stroke: #cbd5e1; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #475569; }
      .text { fill: #f8fafc; }
      .muted { fill: #cbd5e1; }
      .track { fill: #334155; }
      .bar { fill: #60a5fa; }
      .rule { stroke: #475569; }
    }
  </style>
